<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV - Muhammad Azim</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; margin: 0; background: #f4f6f9; color: #333; line-height: 1.5; }
  .container { width: 100%; max-width: 210mm; margin: 0 auto; background: white; padding: 15mm; box-sizing: border-box; }
  @media (min-width: 768px) { .container { padding: 20mm; margin: 20px auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); } }
  
  h1 { font-size: 28px; margin: 0 0 5px; color: #000; }
  h2 { font-size: 16px; border-bottom: 2px solid #000; padding-bottom: 5px; margin: 25px 0 10px; text-transform: uppercase; font-weight: 700; }
  p { font-size: 13px; margin: 0 0 10px; text-align: justify; }
  
  .contact { font-size: 13px; margin-bottom: 20px; color: #555; }
  .section { margin-bottom: 20px; }
  .item-title { font-weight: 700; font-size: 14px; margin: 0; }
  .item-meta { font-size: 12px; color: #666; margin: 2px 0 5px; }
  
  ul { margin: 5px 0 15px; padding-left: 20px; }
  li { font-size: 13px; margin-bottom: 3px; }
  
  .skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .skill-cat { font-weight: 700; font-size: 13px; margin: 10px 0 5px; display: block; }

  .download-btn { text-align: right; margin-bottom: 20px; }
  button { padding: 10px 20px; border: none; background: #000; color: #fff; cursor: pointer; font-weight: 600; transition: 0.3s; }
  button:hover { background: #333; }

  @media print {
    body { background: white; }
    .container { width: 100%; margin: 0; padding: 0; box-shadow: none; }
    .download-btn { display: none; }
    @page { size: A4; margin: 15mm; }
    .section { break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="download-btn">
    <button onclick="window.print()">Download as PDF</button>
  </div>

  <h1 id="name"></h1>
  <div class="contact" id="contact"></div>

  <div class="section">
    <h2>Professional Summary</h2>
    <p id="summary"></p>
  </div>

  <div class="section">
    <h2>Work Experience</h2>
    <div id="experience"></div>
  </div>

  <div class="section">
    <h2>Education</h2>
    <div id="education"></div>
  </div>

  <div class="section">
    <h2>Key Skills</h2>
    <div id="skills" class="skills-grid"></div>
  </div>

  <div class="section">
    <h2>Certifications</h2>
    <ul id="certificates"></ul>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script>
function toCertificateTitleFromFilename(filename) {
  const withoutExtension = filename.replace(/\.pdf$/i, '');
  const normalized = withoutExtension
    .replace(/[-_]+/g, ' ')
    .replace(/\b\w/g, (ch) => ch.toUpperCase());

  return normalized.trim();
}

async function renderCvCertificateList() {
  const certRoot = document.getElementById('certificates');
  if (!certRoot) return;

  try {
    const response = await fetch('assets/pdf/certificates/');
    if (!response.ok) {
      throw new Error('Certificate directory request failed');
    }

    const html = await response.text();
    const matches = [...html.matchAll(/href=["']([^"']+\.pdf)["']/gi)];
    const pdfFiles = matches
      .map((match) => match[1])
      .filter((value) => value && value.toLowerCase().endsWith('.pdf'))
      .map((value) => value.replace(/\\/g, '/'));

    const titles = pdfFiles.map((file) => {
      const fileName = file.split('/').pop();
      return toCertificateTitleFromFilename(fileName);
    });

    certRoot.innerHTML = titles.map((title) => `<li>${title}</li>`).join('');
  } catch (error) {
    const data = window.portfolioData || {};
    const fallbackCertificates = Array.isArray(data.certificates) ? data.certificates : [];
    certRoot.innerHTML = fallbackCertificates
      .map((c) => `<li>${c.title || ''}</li>`)
      .join('');
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const data = window.portfolioData;
  if (!data) return;

  document.getElementById("name").textContent = data.name;
  document.getElementById("contact").textContent = `${data.contact.email} | ${data.contact.phone} | ${data.location}`;
  document.getElementById("summary").textContent = data.about.bio; // Using bio as summary

  const renderList = (arr) => `<ul>${arr.map(item => `<li>${item}</li>`).join('')}</ul>`;

  const expRoot = document.getElementById("experience");
  data.experience.forEach(job => {
    expRoot.innerHTML += `
      <div style="margin-bottom: 15px;">
        <p class="item-title">${job.title}</p>
        <p class="item-meta">${job.company} | ${job.period}</p>
        ${renderList(job.description)}
      </div>`;
  });

  const eduRoot = document.getElementById("education");
  data.education.forEach(edu => {
    eduRoot.innerHTML += `
      <div style="margin-bottom: 10px;">
        <p class="item-title">${edu.degree}</p>
        <p class="item-meta">${edu.institution} | ${edu.period}</p>
        ${renderList(edu.details)}
      </div>`;
  });

  const skillsRoot = document.getElementById("skills");
  data.skills.forEach(cat => {
    const skillNames = cat.items.map(i => i.name);
    skillsRoot.innerHTML += `<div><span class="skill-cat">${cat.category}</span>${renderList(skillNames)}</div>`;
  });

  renderCvCertificateList();
});
</script>
</body>
</html>
