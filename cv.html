<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV - Muhammad Azim</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', Arial, sans-serif;
  margin: 0;
  background: #f4f6f9;
}

.container {
  width: 210mm;
  min-height: 297mm;
  margin: 20px auto;
  background: white;
  padding: 20mm;
  box-sizing: border-box;
}

h1 { font-size: 26px; margin-bottom: 5px; }
h2 {
  font-size: 14px;
  border-bottom: 1px solid #000;
  padding-bottom: 4px;
  margin-top: 20px;
  text-transform: uppercase;
}

.contact { font-size: 13px; margin-bottom: 15px; }
.section { margin-bottom: 15px; }
.job-title { font-weight: 600; }
.company-period { font-size: 12px; color: #555; }

ul {
  margin: 6px 0;
  padding-left: 18px;
}

li { font-size: 13px; margin-bottom: 4px; }

.skills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.skill-badge {
  background: #e8f0fe;
  padding: 4px 8px;
  border-radius: 3px;
  font-size: 11px;
}

/* Hide button when printing */
.download-btn { text-align: right; margin-bottom: 10px; }

button {
  padding: 8px 14px;
  border: none;
  background: #000;
  color: white;
  cursor: pointer;
}

@media print {
  body { background: white; }
  .download-btn { display: none; }

  @page {
    size: A4;
    margin: 20mm;
  }

  .container {
    margin: 0;
    width: auto;
    min-height: auto;
    padding: 0;
  }
}

@media print {
  @page {
    size: A4;
    margin: 12mm;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="download-btn">
    <button onclick="downloadPDF()">Download as PDF</button>
  </div>

  <h1 id="name"></h1>
  <div class="contact" id="contact"></div>

  <div class="section">
    <h2>Professional Summary</h2>
    <p id="summary"></p>
  </div>

  <div class="section">
    <h2>Work Experience</h2>
    <div id="experience"></div>
  </div>

  <div class="section">
    <h2>Education</h2>
    <div id="education"></div>
  </div>

  <div class="section">
    <h2>Key Skills</h2>
    <div class="skills" id="skills"></div>
  </div>

  <div class="section">
    <h2>Certifications</h2>
    <ul id="certificates"></ul>
  </div>

</div>

<script src="assets/js/data.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {

  if (!window.portfolioData) {
    alert("portfolioData not found.");
    return;
  }

  document.getElementById("name").textContent = portfolioData.name;

  document.getElementById("contact").innerHTML =
    `${portfolioData.contact.email} | 
     ${portfolioData.contact.phone} | 
     ${portfolioData.contact.location}`;

  document.getElementById("summary").textContent =
    portfolioData.summary;

  const exp = document.getElementById("experience");
  portfolioData.experience.forEach(job => {
    exp.innerHTML += `
      <p class="job-title">${job.title}</p>
      <p class="company-period">${job.company} | ${job.period}</p>
      <ul>
        ${job.description.map(d => `<li>${d}</li>`).join("")}
      </ul>
    `;
  });

  const edu = document.getElementById("education");
  portfolioData.education.forEach(e => {
    edu.innerHTML += `
      <p class="job-title">${e.degree}</p>
      <p class="company-period">${e.institution} | ${e.period}</p>
      <ul>
        ${e.details.map(d => `<li>${d}</li>`).join("")}
      </ul>
    `;
  });

  const skills = document.getElementById("skills");
  portfolioData.skills.forEach(skill => {
    skills.innerHTML += `<span class="skill-badge">${skill}</span>`;
  });

  const cert = document.getElementById("certificates");
  portfolioData.Certificates.forEach(c => {
    cert.innerHTML += `<li>${c}</li>`;
  });

});

function downloadPDF() {
  window.print();
}
</script>

</body>
</html>
