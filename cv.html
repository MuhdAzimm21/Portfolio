<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV - Muhammad Azim</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  font-family: 'Inter', Arial, sans-serif;
  margin: 0;
  background: #f4f6f9;
}

.container {
  max-width: 900px;
  margin: 40px auto;
  background: white;
  padding: 40px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

h1 {
  font-size: 28px;
  margin-bottom: 5px;
}

h2 {
  font-size: 16px;
  border-bottom: 2px solid #000;
  padding-bottom: 5px;
  margin-top: 30px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.contact {
  font-size: 14px;
  margin-bottom: 20px;
}

.section {
  margin-bottom: 20px;
}

.job-title {
  font-weight: 600;
}

.company-period {
  font-size: 13px;
  color: #555;
}

ul {
  margin: 8px 0;
  padding-left: 18px;
}

li {
  margin-bottom: 5px;
  font-size: 14px;
}

.skills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.skill-badge {
  background: #e8f0fe;
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 12px;
}

.download-btn {
  text-align: right;
  margin-bottom: 20px;
}

button {
  padding: 10px 18px;
  border: none;
  background: #000;
  color: white;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  background: #333;
}

@media print {
  body {
    background: white;
  }
  .download-btn {
    display: none;
  }
  .container {
    box-shadow: none;
    margin: 0;
  }
}
</style>
</head>

<body>

<div class="container" id="cvContent">

  <div class="download-btn">
    <button onclick="downloadPDF()">Download as PDF</button>
  </div>

  <h1 id="name"></h1>
  <div class="contact" id="contact"></div>

  <div class="section">
    <h2>Professional Summary</h2>
    <p id="summary"></p>
  </div>

  <div class="section">
    <h2>Work Experience</h2>
    <div id="experience"></div>
  </div>

  <div class="section">
    <h2>Education</h2>
    <div id="education"></div>
  </div>

  <div class="section">
    <h2>Key Skills</h2>
    <div class="skills" id="skills"></div>
  </div>

  <div class="section">
    <h2>Certifications</h2>
    <ul id="certificates"></ul>
  </div>

</div>

<!-- Your data.js -->
<script src="assets/js/data.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {

  // Name
  document.getElementById("name").textContent = portfolioData.name;

  // Contact
  document.getElementById("contact").innerHTML = `
    ${portfolioData.contact.email} | 
    ${portfolioData.contact.phone} | 
    ${portfolioData.contact.location}
  `;

  // Summary
  document.getElementById("summary").textContent = portfolioData.summary;

  // Experience
  const expContainer = document.getElementById("experience");
  portfolioData.experience.forEach(job => {
    const div = document.createElement("div");
    div.innerHTML = `
      <p class="job-title">${job.title}</p>
      <p class="company-period">${job.company} | ${job.period}</p>
      <ul>
        ${job.description.map(item => `<li>${item}</li>`).join("")}
      </ul>
    `;
    expContainer.appendChild(div);
  });

  // Education
  const eduContainer = document.getElementById("education");
  portfolioData.education.forEach(edu => {
    const div = document.createElement("div");
    div.innerHTML = `
      <p class="job-title">${edu.degree}</p>
      <p class="company-period">${edu.institution} | ${edu.period}</p>
      <ul>
        ${edu.details.map(detail => `<li>${detail}</li>`).join("")}
      </ul>
    `;
    eduContainer.appendChild(div);
  });

  // Skills
  const skillContainer = document.getElementById("skills");
  portfolioData.skills.forEach(skill => {
    const span = document.createElement("span");
    span.className = "skill-badge";
    span.textContent = skill;
    skillContainer.appendChild(span);
  });

  // Certificates
  const certContainer = document.getElementById("certificates");
  portfolioData.Certificates.forEach(cert => {
    const li = document.createElement("li");
    li.textContent = cert;
    certContainer.appendChild(li);
  });

});
</script>

<script>
async function downloadPDF() {
  const { jsPDF } = window.jspdf;

  const doc = new jsPDF({
    orientation: "portrait",
    unit: "pt",
    format: "a4"
  });

  const element = document.getElementById("cvContent");

  if (!element) {
    alert("CV content not found.");
    return;
  }

  await doc.html(element, {
    margin: 20,
    autoPaging: "text",
    html2canvas: {
      scale: 0.6
    },
    callback: function (doc) {
      doc.save("Muhammad_Azim_CV.pdf");
    }
  });
}
</script>

</body>
</html>
