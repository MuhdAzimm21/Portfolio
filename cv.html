<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV - Muhammad Azim</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', Arial, sans-serif;
  margin: 0;
  background: #f4f6f9;
}

.container {
  width: 100%;
  max-width: 210mm;
  min-height: 297mm;
  margin: 0 auto;
  background: white;
  padding: 10mm;
  box-sizing: border-box;
}

@media (min-width: 768px) {
  .container {
    padding: 20mm;
    margin: 20px auto;
  }
}

h1 { font-size: 26px; margin-bottom: 5px; }
h2 {
  font-size: 14px;
  border-bottom: 1px solid #000;
  padding-bottom: 4px;
  margin-top: 20px;
  text-transform: uppercase;
}

p { 
  text-align: justify;
  font-size: 13px;
  margin-bottom: 4px;
  } 

.contact { font-size: 13px; margin-bottom: 15px; }
.section { margin-bottom: 15px; }
.job-title { font-weight: 600; }
.company-period { font-size: 12px; color: #555; }

ul {
  margin: 6px 0;
  padding-left: 18px;
}

li { font-size: 13px; margin-bottom: 4px; }

.skills-category {
  list-style: none;
  padding-left: 0;
  font-weight: 600;
  margin-top: 10px;
}

/* Hide button when printing */
.download-btn { text-align: right; margin-bottom: 10px; }

button {
  padding: 8px 14px;
  border: none;
  background: #000;
  color: white;
  cursor: pointer;
}

@media print {
  body { 
    background: white; 
    margin: 0;
    padding: 0;
  }
  
  .download-btn { display: none; }

  @page {
    size: A4;
    margin: 15mm;
  }

  .container {
    margin: 0;
    width: 100%;
    max-width: none;
    min-height: auto;
    padding: 0;
  }

  .section {
    break-inside: avoid;
    margin-bottom: 15px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="download-btn">
    <button onclick="downloadPDF()">Download as PDF</button>
  </div>

  <h1 id="name"></h1>
  <div class="contact" id="contact"></div>

  <div class="section">
    <h2>Professional Summary</h2>
    <p id="summary"></p>
  </div>

  <div class="section">
    <h2>Work Experience</h2>
    <div id="experience"></div>
  </div>

  <div class="section">
    <h2>Education</h2>
    <div id="education"></div>
  </div>

  <div class="section">
    <h2>Key Skills</h2>
    <div id="skills-list"></div>
  </div>

  <div class="section">
    <h2>Certifications</h2>
    <ul id="certificates"></ul>
  </div>

</div>

<script src="assets/js/data.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {

  if (!window.portfolioData) {
    alert("portfolioData not found.");
    return;
  }

  document.getElementById("name").textContent = portfolioData.name;

  document.getElementById("contact").innerHTML =
    `${portfolioData.contact.email} | 
     ${portfolioData.contact.phone} | 
     ${portfolioData.contact.location}`;

  document.getElementById("summary").textContent =
    portfolioData.summary;

  const exp = document.getElementById("experience");
  portfolioData.experience.forEach(job => {
    exp.innerHTML += `
      <p class="job-title">${job.title}</p>
      <p class="company-period">${job.company} | ${job.period}</p>
      <ul>
        ${job.description.map(d => `<li>${d}</li>`).join("")}
      </ul>
    `;
  });

  const edu = document.getElementById("education");
  portfolioData.education.forEach(e => {
    edu.innerHTML += `
      <p class="job-title">${e.degree}</p>
      <p class="company-period">${e.institution} | ${e.period}</p>
      <ul>
        ${e.details.map(d => `<li>${d}</li>`).join("")}
      </ul>
    `;
  });

const skillsContainer = document.getElementById("skills-list");

Object.entries(portfolioData.skills).forEach(([category, skillArray]) => {
  const categoryTitle = document.createElement("p");
  categoryTitle.className = "skills-category";
  categoryTitle.textContent = formatCategory(category);
  
  const skillList = document.createElement("ul");
  skillList.innerHTML = skillArray.map(skill => `<li>${skill}</li>`).join("");
  
  skillsContainer.appendChild(categoryTitle);
  skillsContainer.appendChild(skillList);
});

function formatCategory(category) {
  return category
    .replace(/_/g, " ")
    .replace(/\b\w/g, char => char.toUpperCase());
}

  const cert = document.getElementById("certificates");
  portfolioData.Certificates.forEach(c => {
    cert.innerHTML += `<li>${c}</li>`;
  });

});

function downloadPDF() {
  window.print();
}
</script>

</body>
</html>
